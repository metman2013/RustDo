[package]
name = "rustdo"
version = "0.1.0"
edition = "2021"
description = "A fast, local-first desktop to-do app (a Microsoft To Do alternative) written in Rust"
license = "MIT"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["datepicker"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
csv = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
