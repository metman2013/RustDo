[workspace.package]
# The one place to bump the version for a release (desktop, web and Android).
version = "0.4.8"

[package]
name = "rustdo"
version.workspace = true
edition = "2021"
description = "A fast, local-first to-do app (a Microsoft To Do alternative) for desktop, web and Android"
license = "MIT"
repository = "https://github.com/metman2013/RustDo"

# The app itself lives in a library so the same code runs as the desktop binary,
# the WebAssembly PWA (built with `--crate-type cdylib`, see tools/build-web.ps1) and
# the Android APK (the small `android/` crate wraps it as a shared library).
[lib]
name = "rustdo_app"

[workspace]
members = ["."]
# The Android wrapper is its own workspace: cargo-apk can't build a member of a
# workspace whose root is also a package.
exclude = ["android"]

[[bin]]
name = "rustdo"
path = "src/main.rs"

[features]
default = ["updates"]
# In-app update checks against GitHub Releases (desktop and Android).
updates = ["dep:ureq"]

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["datepicker"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
csv = "1"
web-time = "1"
log = "0.4"
# "Sync my devices" (account.rs): HTTP on desktop, Android and in the browser alike.
ehttp = "0.5"
# Settings › Language › Automatic: the device's language.
sys-locale = "0.3"
# Background images: reading JPG/PNG, shrinking and saving as JPEG; base64 to sync them.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

# Desktop (Windows / macOS / Linux)
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
directories = "5"
rfd = "0.15"
ureq = { version = "2", optional = true }

# Windows: scheduled toast notifications for reminders (same version egui already uses).
[target.'cfg(windows)'.dependencies]
# The companion's tray icon.
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.58", features = [
    "UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections",
    "Win32_UI_WindowsAndMessaging",
    # Microsoft Store package: detect it, its startup task (store_package.rs).
    "Win32_Storage_Packaging_Appx", "ApplicationModel", "ApplicationModel_Activation",
] }
# Windows: Direct3D (wgpu) as a fallback when OpenGL can't start (virtual machines,
# Remote Desktop, missing graphics drivers). See diagnostics.rs.
eframe = { version = "0.31", features = ["wgpu"] }

# Linux: desktop notifications over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
# Linux: the companion's tray icon, over D-Bus (StatusNotifierItem; no GTK main loop).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Web / PWA
[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = "0.15"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Storage",
    "Blob", "BlobPropertyBag", "Url", "HtmlElement", "HtmlAnchorElement", "Location", "MediaQueryList",
    "Notification", "NotificationOptions", "NotificationPermission",
    "Navigator", "ServiceWorkerContainer", "ServiceWorkerRegistration", "History",
] }
# Web: Microsoft sign-in for the To Do import (PKCE).
sha2 = "0.10"

# Android
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.14"
# Reading the status/navigation bar and keyboard sizes from Android's Java API.
jni = "0.21"
ndk-context = "0.1"
ureq = { version = "2", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# ---------------------------------------------------------------- Linux .deb (cargo-deb)
[package.metadata.deb]
name = "rustdo"
maintainer = "metman2013 <6624070+metman2013@users.noreply.github.com>"
copyright = "2026 metman2013"
license-file = ["LICENSE", "0"]
extended-description = "A fast, local-first to-do app modeled on Microsoft To Do: My Day, Important, Planned, lists, steps, reminders, repeats, notes, backups and Microsoft To Do import. No account, no cloud, no telemetry."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/rustdo", "usr/bin/", "755"],
    ["assets/rustdo.desktop", "usr/share/applications/", "644"],
    ["assets/rustdo.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/rustdo/", "644"],
]

# Fedora / openSUSE / RHEL package (cargo generate-rpm, in CI).
[package.metadata.generate-rpm]
name = "rustdo"
summary = "A fast, private to-do app"
assets = [
    { source = "target/release/rustdo", dest = "/usr/bin/rustdo", mode = "755" },
    { source = "assets/rustdo.desktop", dest = "/usr/share/applications/rustdo.desktop", mode = "644" },
    { source = "assets/rustdo.png", dest = "/usr/share/icons/hicolor/512x512/apps/rustdo.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/rustdo/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/rustdo/LICENSE", mode = "644", doc = true },
]

# egui-winit with one change: Android's back button reaches the app (as Escape), so back
# steps through RustDo instead of being dropped. See vendor/egui-winit/src/lib.rs
# ("RustDo:"). Drop this when egui maps the back key itself.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
# egui_glow with high-precision shaders (crisp letters on mobile GPUs; see
# vendor/egui_glow/src/shader/vertex.glsl).
egui_glow = { path = "vendor/egui_glow" }
