# Builds RustDo for every platform.
#  - Every push / pull request: tests + all builds (downloadable as workflow artifacts).
#  - Push to main: also publishes the web app to GitHub Pages.
#  - Release: a push to main whose Cargo.toml version has no release yet (e.g. merging a PR
#    that bumped the version), or pushing a tag like v0.2.0, creates a GitHub Release with
#    the Windows installer, the portable exe, the Linux packages, the Android APK and the
#    Hub exe. It's only published if every build succeeds. The installed apps find it with
#    their update check.
#  - RustDo Hub (hub/): tested on every push; main publishes the Docker image as :edge,
#    a version tag as :<version> and :latest; releases also get the Hub's Windows exe.
name: Build

on:
  push:
    # claude/**: work branches from Claude Code sessions get the full build too (no
    # release, no web deploy, no Docker publish: those only happen from main or a tag).
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether this run publishes a release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$V" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match version $V in Cargo.toml"; exit 1
            fi
            RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ -z "$(git ls-remote --tags origin "refs/tags/v$V")" ]; then
              echo "::notice::Version $V has no release yet: this run will publish v$V."
              RELEASE=true
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (no personal paths)
        shell: pwsh
        run: ./tools/build-release.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$v" installer\rustdo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Copy-Item target\release\rustdo.exe "target\installer\RustDo-$v-portable.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: target/installer/*.exe

  # Microsoft Store package (MSIX) from the Windows build's exe. Not attached to the GitHub
  # release (an unsigned MSIX can't be installed directly): download the "store" artifact
  # from the run and upload it in Partner Center, which signs and publishes it.
  # Identity: repository variables MSIX_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME.
  store:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: windows
      - name: Build the Store package
        shell: pwsh
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $v = (Select-String Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $exe = Get-ChildItem windows -Filter "*-portable.exe" | Select-Object -First 1
          if (-not $exe) { throw "portable exe not found in the windows artifact" }
          ./tools/build-msix.ps1 -Exe $exe.FullName -Version $v -Out out
      - uses: actions/upload-artifact@v6
        with:
          name: store
          path: out/*.msix

  linux:
    needs: test
    # Built on an older Ubuntu so the binary also runs on older distros (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies (egui windowing, GTK file dialogs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - name: Build
        run: cargo build --release
      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - name: Package AppImage
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          mkdir -p AppDir/usr/bin out
          cp target/release/rustdo AppDir/usr/bin/
          cp assets/rustdo.desktop assets/rustdo.png AppDir/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/rustdo" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "out/RustDo-$V-x86_64.AppImage"
          cp target/debian/*.deb out/
          ls -la out
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: out/*

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen (same version as Cargo.lock)
        run: |
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WB" --locked
      - name: Build web app
        shell: pwsh
        run: ./tools/build-web.ps1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-web:
    # Needs Settings > Pages > Source set to "GitHub Actions" (one-time).
    # Only main deploys: the github-pages environment refuses tags, and a release tag
    # points at a commit main has already deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Hub version must match the app
        run: |
          A=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          B=$(grep -m1 '^version = ' hub/Cargo.toml | cut -d'"' -f2)
          if [ "$A" != "$B" ]; then
            echo "::error::Cargo.toml ($A) and hub/Cargo.toml ($B) versions differ. Run tools/set-version.ps1."; exit 1
          fi
          # The Home Assistant app pulls the hub image tagged with its version.
          C=$(grep -m1 '^version: ' homeassistant/rustdo_hub/config.yaml | cut -d'"' -f2)
          if [ "$A" != "$C" ]; then
            echo "::error::homeassistant/rustdo_hub/config.yaml ($C) doesn't match the app ($A). Run tools/set-version.ps1."; exit 1
          fi
      - name: Home Assistant app configuration
        uses: frenck/action-app-linter@v2
        with:
          path: ./homeassistant/rustdo_hub
      - name: Unit tests
        working-directory: hub
        run: cargo test --locked
      - name: App + hub end-to-end
        run: |
          (cd hub && cargo build --locked)
          hub/target/debug/rustdo-hub --port 7979 --data "$RUNNER_TEMP/hub" &
          sleep 2
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
          RUSTDO_HUB_URL=127.0.0.1:7979 cargo test --test hub_e2e -- --ignored

  hub-windows:
    needs: hub
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: hub
        run: cargo build --release --locked
      - name: Collect
        shell: pwsh
        run: |
          $v = (Select-String hub/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item hub/target/release/rustdo-hub.exe "out/RustDo-Hub-$v-windows.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: hub-windows
          path: out/*.exe

  hub-docker:
    needs: [hub, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5
      # The image as people run it, on this machine: the hub must be able to save even
      # when the data folder is a bind mount owned by root (Home Assistant, NAS boxes).
      - name: Smoke test (data folder owned by root)
        run: |
          docker build -t rustdo-hub:test hub
          mkdir -p "$RUNNER_TEMP/hubdata" && sudo chown root:root "$RUNNER_TEMP/hubdata" && sudo chmod 755 "$RUNNER_TEMP/hubdata"
          docker run -d --name hubtest -p 7979:7979 -v "$RUNNER_TEMP/hubdata:/data" rustdo-hub:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7979/api/hello && break; sleep 1; done
          curl -fsS -X POST http://127.0.0.1:7979/api/account/new
          docker logs hubtest
          test -s "$RUNNER_TEMP/hubdata/hub.json" || { echo "::error::the hub couldn't save to a root-owned /data"; exit 1; }
          ls -la "$RUNNER_TEMP/hubdata" "$RUNNER_TEMP/hubdata/backups"
          docker exec hubtest sh -c 'ps -o user,comm | grep rustdo-hub'
          docker rm -f hubtest
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rustdo-hub
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=RustDo Hub
            org.opencontainers.image.description=Share RustDo lists with family on your own network
      # amd64 for PCs and most NAS boxes, arm64 for Raspberry Pi and ARM NAS boxes.
      - uses: docker/build-push-action@v7
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Versions must match
        run: |
          A=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          B=$(grep -m1 '^version = ' android/Cargo.toml | cut -d'"' -f2)
          if [ "$A" != "$B" ]; then
            echo "::error::Cargo.toml ($A) and android/Cargo.toml ($B) versions differ. Run tools/set-version.ps1."; exit 1
          fi
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key. This APK can't be installed over another build; see README > Android signing."
            keytool -genkeypair -keystore "$KS" -storepass throwaway -keypass throwaway \
              -alias rustdo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RustDo" -noprompt
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=throwaway" >> "$GITHUB_ENV"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$KS" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          cargo apk build --release 2>&1 | tee "$RUNNER_TEMP/apk.log"
      - name: Report APK build errors
        # Job logs need a GitHub sign-in to read; annotations are visible to everyone.
        if: failure()
        run: |
          msg=$(tail -n 60 "$RUNNER_TEMP/apk.log" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=APK build failed::$msg"
      - name: Collect and verify APK
        # Never ship an unsigned APK: Android refuses to install it.
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "::notice title=APK files built::$(find android/target -name '*.apk' | tr '\n' ' ')"
          APK=android/target/release/apk/RustDo.apk
          if [ ! -f "$APK" ]; then echo "::error::$APK was not produced"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if ! "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/sig.txt" 2>&1; then
            echo "::error title=APK is not signed::$(tr '\n' ' ' < "$RUNNER_TEMP/sig.txt")"; exit 1
          fi
          echo "::notice title=APK signed by::$(grep -m1 'SHA-256' "$RUNNER_TEMP/sig.txt")"
          mkdir -p out
          cp "$APK" "out/RustDo-$V.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: out/*.apk

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, linux, web, android, hub-windows, hub-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # The release notes are this version's section of CHANGELOG.md (the same text the
      # app shows in "What's new"); GitHub's list of merged pull requests follows it.
      - name: Release notes from CHANGELOG.md
        run: |
          V="${{ needs.version.outputs.version }}"
          awk -v v="$V" '
            /^## / { on = (index($0, "## " v " ") == 1 || $0 == "## " v); next }
            on && /^### / { sub(/^### /, "### "); print; next }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '^- ' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entries for $V"; exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      # Only the app downloads (not the web build's internal Pages bundle).
      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: android
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: hub-windows
          path: artifacts
      # From main this also creates the v<version> tag on the commit that was built.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: artifacts/*
      # Tell the RustDo Discord channel. Needs the DISCORD_WEBHOOK_URL repository secret
      # (without it this does nothing); a Discord hiccup never fails the release.
      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          V="${{ needs.version.outputs.version }}"
          tools/announce-discord.sh "$V" "$RUNNER_TEMP/notes.md" \
            "https://github.com/${{ github.repository }}/releases/tag/v$V"

  # Sends the new version's Store package to the Microsoft Store as a new submission (it
  # goes through certification, then the Store updates everyone). Needs the repository
  # secrets STORE_TENANT_ID, STORE_CLIENT_ID, STORE_CLIENT_SECRET and STORE_SELLER_ID (a
  # Partner Center "Microsoft Entra application" with the Manager role) and the repository
  # variable STORE_PRODUCT_ID (the Store ID, e.g. 9N...); without them it does nothing. A
  # failure here (e.g. the previous submission is still in certification) doesn't affect
  # the GitHub release; the package can then be uploaded by hand from the "store" artifact.
  store-submit:
    if: needs.version.outputs.release == 'true'
    needs: [version, store, release]
    runs-on: windows-latest
    continue-on-error: true
    env:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
      # RustDo's Store ID (public: it's in the Store link); a repository variable overrides it.
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID || secrets.STORE_PRODUCT_ID || '9PK0DF0QBWWM' }}
    steps:
      - name: Check the Store settings
        id: cfg
        shell: pwsh
        run: |
          $missing = @('STORE_TENANT_ID','STORE_CLIENT_ID','STORE_CLIENT_SECRET','STORE_SELLER_ID','STORE_PRODUCT_ID') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Host "::notice::Not submitting to the Microsoft Store: $($missing -join ', ') not set."
            "ready=false" >> $env:GITHUB_OUTPUT
          } else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }
      # The CHANGELOG and tools/store_whats_new.py, for "What's new".
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@v7
        with:
          name: store
          path: store
      - if: steps.cfg.outputs.ready == 'true'
        uses: microsoft/setup-msstore-cli@v1.4
      # Upload to a draft submission, set "What's new" from CHANGELOG.md, then send it for
      # certification. If "What's new" can't be set, the draft goes out with the previous
      # text rather than not at all.
      - name: Submit to the Microsoft Store
        if: steps.cfg.outputs.ready == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore sign-in failed (check the four STORE_* secrets; the key may have expired)' }
          $msix = Get-ChildItem store -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'no .msix in the store artifact' }
          $id = $env:STORE_PRODUCT_ID

          Write-Host "Uploading $($msix.Name) to a draft submission for product $id"
          msstore publish $msix.FullName -id $id --noCommit -v
          if ($LASTEXITCODE -ne 0) {
            # An older Store tool without --noCommit: submit the usual way, What's new unchanged.
            Write-Host "::warning::Upload to a draft failed; submitting directly without a new What's new."
            msstore publish $msix.FullName -id $id -v
            if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }
            exit 0
          }

          Write-Host "What's new for ${env:VERSION}:"
          python tools/store_whats_new.py notes $env:VERSION
          $sub = Join-Path $env:RUNNER_TEMP 'submission.txt'
          $patched = Join-Path $env:RUNNER_TEMP 'submission.json'
          msstore submission get $id | Out-File -FilePath $sub -Encoding utf8
          if ($LASTEXITCODE -eq 0) {
            python tools/store_whats_new.py patch $env:VERSION $sub $patched
            if ($LASTEXITCODE -eq 0) {
              msstore submission updateMetadata $id $patched
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Couldn't set What's new in the Store; submitting without it." }
            } else {
              Write-Host "::warning::Couldn't read the Store submission; submitting without a new What's new."
            }
          } else {
            Write-Host "::warning::msstore submission get failed; submitting without a new What's new."
          }

          Write-Host 'Sending the submission for certification'
          msstore submission publish $id
          if ($LASTEXITCODE -ne 0) { throw 'msstore submission publish failed' }
