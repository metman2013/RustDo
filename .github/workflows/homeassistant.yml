# Tests the Home Assistant integration (custom_components/rustdo) against a real RustDo Hub.
name: Home Assistant integration

on:
  push:
    paths: ["custom_components/**", "tests/homeassistant/**", "hub/**", ".github/workflows/homeassistant.yml"]
  pull_request:
    paths: ["custom_components/**", "tests/homeassistant/**", "hub/**", ".github/workflows/homeassistant.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Start a hub
        run: |
          cargo build --release --manifest-path hub/Cargo.toml
          mkdir -p /tmp/hub
          hub/target/release/rustdo-hub --port 7979 --data /tmp/hub &
          for i in $(seq 30); do curl -fs http://127.0.0.1:7979/ >/dev/null && break; sleep 1; done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Home Assistant's test harness
        run: pip install pytest-homeassistant-custom-component
      - name: Test
        env:
          RUSTDO_HUB_URL: http://127.0.0.1:7979
        run: python -m pytest -c tests/homeassistant/pytest.ini tests/homeassistant -q
