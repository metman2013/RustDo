# Android wrapper: packages the RustDo library as the native library of an APK.
# Build with cargo-apk from this folder:  cargo apk build --release
#
# This is a separate workspace (see the empty [workspace] below) because cargo-apk
# can't build a crate inside a workspace whose root is also a package.
[package]
name = "rustdo-android"
# Must match [workspace.package] version in ../Cargo.toml (CI checks this).
# cargo-apk derives Android's versionCode from it, so every release installs as an update.
version = "0.2.5"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
name = "rustdo"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustdo = { path = ".." }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[package.metadata.android]
package = "io.github.metman2013.rustdo"
apk_name = "RustDo"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
opengles_version = [3, 0]
required = true

[package.metadata.android.application]
label = "RustDo"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboard|keyboardHidden|uiMode|density"
launch_mode = "singleTop"
orientation = "unspecified"
