# Android: the RustDo library for the app (see app/ and settings.gradle for the rest).
# cargo-ndk builds it into app/src/main/jniLibs, then Gradle makes the APK and App Bundle.
#
# A separate workspace (the empty [workspace] below), so this builds on its own.
[package]
name = "rustdo-android"
# Must match [workspace.package] version in ../Cargo.toml (CI checks this).
# app/build.gradle derives Android's versionCode from it, so every release installs as an update.
version = "0.4.15"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
name = "rustdo"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustdo = { path = ".." }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The APK and App Bundle are built with Gradle (see app/ and settings.gradle): cargo-ndk
# builds this library into app/src/main/jniLibs, Gradle adds the Java parts.

# The same patched egui-winit as the app (Android's back button; see ../Cargo.toml).
[patch.crates-io]
egui-winit = { path = "../vendor/egui-winit" }
# egui_glow with high-precision shaders (crisp letters on mobile GPUs; see
# vendor/egui_glow/src/shader/vertex.glsl).
egui_glow = { path = "../vendor/egui_glow" }
