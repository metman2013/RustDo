<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No viewport-fit=cover: the browser keeps the app clear of notches and system bars.
       resizes-content: the on-screen keyboard shrinks the page (and the app) instead of
       covering it, so what's being typed in stays visible. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <title>RustDo</title>
  <meta name="description" content="A fast, private to-do app. Your tasks stay on your device.">
  <meta name="theme-color" content="#467de6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root { color-scheme: light dark; --bg: #f8f8f8; --fg: #555; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #aaa; } }
    /* overscroll-behavior: the app draws its own pull-to-refresh; stop the browser's. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
    canvas#rustdo_canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 16px system-ui, sans-serif; color: var(--fg); padding: 16px; text-align: center;
    }
    /* "Get it from Microsoft": Windows visitors in a browser tab only; dismissible. */
    #store-badge {
      position: fixed; right: 16px; bottom: 16px; z-index: 10; display: none;
      align-items: center; gap: 4px; padding: 6px; border-radius: 10px;
      background: var(--bg); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      font: 14px system-ui, sans-serif;
    }
    #store-badge a { display: block; line-height: 0; }
    #store-badge img { height: 48px; width: auto; }
    #store-badge .fallback {
      display: inline-block; padding: 12px 14px; border-radius: 8px; line-height: 1.2;
      background: #000; color: #fff; text-decoration: none;
    }
    #store-badge a { text-decoration: none; }
    #store-badge button {
      border: 0; background: none; color: var(--fg); font-size: 18px; cursor: pointer;
      width: 28px; height: 28px; border-radius: 6px; align-self: flex-start;
    }
    #store-badge button:hover { background: rgba(127, 127, 127, 0.2); }
  </style>
</head>
<body>
  <canvas id="rustdo_canvas"></canvas>
  <div id="loading">Loading RustDo…</div>
  <noscript>RustDo needs JavaScript and WebAssembly.</noscript>
  <div id="store-badge" role="complementary" aria-label="RustDo for Windows">
    <a href="https://apps.microsoft.com/detail/9PK0DF0QBWWM?mode=direct" target="_blank" rel="noopener"
       title="Install RustDo for Windows from the Microsoft Store">
      <img src="https://get.microsoft.com/images/en-us%20dark.svg" alt="Get it from Microsoft"
           onerror="this.outerHTML='<span class=&quot;fallback&quot;>Get RustDo from the Microsoft Store</span>'">
    </a>
    <button type="button" aria-label="Hide" title="Hide">×</button>
  </div>
  <script>
    // The Microsoft Store badge: Windows desktop browsers only, not the installed web app,
    // and not after the visitor hides it.
    (() => {
      const badge = document.getElementById('store-badge');
      const windows = /Windows NT/.test(navigator.userAgent) && !/Xbox|Windows Phone/.test(navigator.userAgent);
      const installed = matchMedia('(display-mode: standalone)').matches;
      let hidden = false;
      try { hidden = localStorage.getItem('rustdo.storeBadgeHidden') === '1'; } catch (_) {}
      if (!windows || installed || hidden) return;
      badge.style.display = 'flex';
      badge.querySelector('button').addEventListener('click', () => {
        badge.style.display = 'none';
        try { localStorage.setItem('rustdo.storeBadgeHidden', '1'); } catch (_) {}
      });
    })();
  </script>
  <script type="module">
    import init from './pkg/rustdo_app.js';
    init().catch((e) => {
      document.getElementById('loading').textContent = 'RustDo couldn’t start: ' + e;
    });

    // Ask the browser not to clear RustDo's stored tasks when space runs low.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    if ('serviceWorker' in navigator) {
      // When a new version is published, the new service worker takes over and we reload once.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloaded) { reloaded = true; location.reload(); }
      });
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
